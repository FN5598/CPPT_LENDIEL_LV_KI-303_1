name: CI

on:
    pull_request:
        branches: [main]
    push:
        tags: ["v*.*.*"]

permissions:
    contents: read

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Show CI build number
              run: echo "CI build ${{ github.run_number }}"

            - name: Verify on Unix
              if: runner.os != 'Windows'
              run: ./mvnw -B verify

            - name: Verify on Windows
              if: runner.os == 'Windows'
              run: .\mvnw.cmd -B verify

            - name: Upload JAR
              uses: actions/upload-artifact@v4
              with:
                  name: jar-${{ matrix.os }}-${{ github.run_number }}
                  path: target/*.jar
                  if-no-files-found: error

    release-tag:
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Validate tag against the Maven project version
              run: |
                  python3 - <<'PYTHON'
                  import os
                  import xml.etree.ElementTree as ET

                  version = ET.parse("pom.xml").findtext(
                      "{http://maven.apache.org/POM/4.0.0}version"
                  )
                  tag = os.environ["GITHUB_REF_NAME"]
                  if tag != f"v{version}":
                      raise SystemExit(f"Tag {tag} does not match pom.xml version {version}")
                  print(f"Validated release tag {tag}")
                  PYTHON
