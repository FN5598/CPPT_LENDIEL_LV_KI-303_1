name: CI

on:
  pull_request:
    branches: [python]
  push:
    branches: [python]
    tags: ["python-v*.*.*"]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        lab: [lab06, lab07]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: src/main/python/${{ matrix.lab }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/main/python/${{ matrix.lab }}/pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Build wheel
        run: python -m build --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kzp-${{ matrix.lab }}-v11-${{ matrix.os }}
          path: src/main/python/${{ matrix.lab }}/dist/*.whl
          if-no-files-found: error

  release-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag against Python package versions
        run: |
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          versions = set()
          for path in Path("src/main/python").glob("lab*/pyproject.toml"):
              with path.open("rb") as source:
                  versions.add(tomllib.load(source)["project"]["version"])

          tag = os.environ["GITHUB_REF_NAME"]
          if tag.removeprefix("v") not in versions:
              raise SystemExit(
                  f"Tag {tag} does not match Python package versions {sorted(versions)}"
              )
          print(f"Validated release tag {tag}")
          PYTHON
