name: CI

on:
    pull_request:
    push:
        branches:
            - '**'
        tags:
            - 'v*.*.*'

permissions:
    contents: read

jobs:
    release-tag:
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Validate release tag against Java or Python package version
              run: |
                  python - <<'PYTHON'
                  import os
                  import tomllib
                  import xml.etree.ElementTree as ET
                  from pathlib import Path

                  java_version = ET.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version")
                  with Path("src/main/python/lab06/pyproject.toml").open("rb") as source:
                      python_version = tomllib.load(source)["project"]["version"]
                  expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
                  if expected not in {java_version, python_version}:
                      raise SystemExit(f"Tag {expected} does not match Java {java_version} or Python {python_version}")
                  print(f"Validated release version {expected}")
                  PYTHON

    verify:
        if: github.event_name == 'pull_request' && github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/')
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Show CI build number
              run: echo "CI build ${{ github.run_number }}"

            - name: Verify on Unix
              if: runner.os != 'Windows'
              run: ./mvnw -B verify

            - name: Verify on Windows
              if: runner.os == 'Windows'
              run: .\mvnw.cmd -B verify

            - name: Upload JAR
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: jar-${{ matrix.os }}-${{ github.run_number }}
                  path: target/*.jar
                  if-no-files-found: error

    python:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                working-directory: src/main/python/lab06
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: src/main/python/lab06/pyproject.toml

            - name: Install package and development tools
              run: python -m pip install -e ".[dev]"

            - name: Run pytest
              run: python -m pytest

            - name: Run Ruff lint
              run: ruff check .

            - name: Check Python formatting
              run: ruff format --check .

            - name: Build wheel
              run: python -m build --outdir dist

            - name: Upload wheel artifact
              uses: actions/upload-artifact@v4
              with:
                  name: kzp-lab06-v11-${{ matrix.os }}
                  path: src/main/python/lab06/dist/*.whl
                  if-no-files-found: error
