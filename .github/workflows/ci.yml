name: CI

on:
    pull_request:
    push:
        branches:
            - '**'
        tags:
            - 'v*.*.*'

permissions:
    contents: read

jobs:
    verify:
        if: github.event_name == 'pull_request' && github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/')
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Show CI build number
              run: echo "CI build ${{ github.run_number }}"

            - name: Validate release tag on Unix
              if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
              run: |
                  expected="${GITHUB_REF_NAME#v}"
                  actual=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
                  test "$expected" = "$actual"

            - name: Validate release tag on Windows
              if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
              shell: pwsh
              run: |
                  $expected = $env:GITHUB_REF_NAME.Substring(1)
                  $actual = (& .\mvnw.cmd -q help:evaluate -Dexpression=project.version -DforceStdout).Trim()
                  if ($expected -ne $actual) { throw "Tag $expected does not match POM version $actual" }

            - name: Verify on Unix
              if: runner.os != 'Windows'
              run: ./mvnw -B verify

            - name: Verify on Windows
              if: runner.os == 'Windows'
              run: .\mvnw.cmd -B verify

            - name: Upload JAR
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: jar-${{ matrix.os }}-${{ github.run_number }}
                  path: target/*.jar
                  if-no-files-found: error

    python:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                working-directory: src/main/python/lab06
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: src/main/python/lab06/pyproject.toml

            - name: Install package and development tools
              run: python -m pip install -e ".[dev]"

            - name: Run pytest
              run: python -m pytest

            - name: Run Ruff lint
              run: ruff check .

            - name: Check Python formatting
              run: ruff format --check .

            - name: Build wheel
              run: python -m build --outdir dist

            - name: Upload wheel artifact
              uses: actions/upload-artifact@v4
              with:
                  name: kzp-lab06-v11-${{ matrix.os }}
                  path: src/main/python/lab06/dist/*.whl
                  if-no-files-found: error
